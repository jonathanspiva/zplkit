name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build

      - name: Run unit tests
        run: swift test

  visual-tests:
    runs-on: macos-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build -c release

      - name: Run visual tests with Labelary comparison
        run: swift run -c release VisualTests --labelary

      - name: Upload visual comparison
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison
          path: |
            Tests/VisualTestHarness/comparison.html
            Tests/VisualTestHarness/output-swift/
            Tests/VisualTestHarness/output-labelary/
          retention-days: 7
