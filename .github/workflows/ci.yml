name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Live-printer tests are opt-in: they need a printer powered on and they
  # mutate printer config, so they never gate a normal push/PR.
  workflow_dispatch:
    inputs:
      printer_ip:
        # Leave blank to fall back to the LIVE_PRINTER_IP repository variable
        # (Settings -> Secrets and variables -> Actions -> Variables), so the
        # real lab IP lives in repo settings, not in this committed file.
        description: "Printer IP (blank = use the LIVE_PRINTER_IP repo variable)"
        required: false
        default: ""

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Three classes of runner, on purpose:
#
#   * GitHub-hosted `xcode-27`: macOS 27 + Xcode 27.0 (Swift 6.4). This is the
#     toolchain that matches the package's advertised floor, so it is what
#     proves the package actually builds for the users we promise support to.
#     Being hosted, it is also safe for fork PRs. The floor job pins this
#     toolchain by path and asserts it against Package.swift, rather than
#     inheriting whatever the image default happens to be. The image is still
#     marked "preview" by GitHub (actions/runner-images#14404), so expect the
#     occasional queueing delay.
#   * Self-hosted mini (`macos-27`) runs macOS 27 with Xcode 27, and is the
#     only machine that can reach the lab printers. It covers the visual suite
#     and the live-printer job.
#   * GitHub-hosted `ubuntu-latest` in the official `swift:6.4` containers, for
#     the Linux and WebAssembly builds of the portable core.
#
# DEVELOPER_DIR is set per-job rather than workflow-wide because the runner
# classes need different paths: the floor pin on the hosted image, and
# /Applications/Xcode.app on the mini.
#
# Test counts: see Scripts/check-test-output.sh. SwiftPM prints one summary
# line per test target, so every count is SUMMED, never tail'd.

# Fork PRs must NOT run on the self-hosted runner: it lives on a private LAN
# (with printer access), so a fork PR running there would execute untrusted code
# on that machine. This condition runs jobs for pushes and same-repo PRs only;
# fork PRs are skipped on the self-hosted jobs. They still get a build and the
# test suite (minus the two Vision OCR suites the hosted VM cannot run) from the
# hosted `floor-build-and-test` job below, which carries no fork gate. As a second layer, keep Actions -> "Require approval for all
# outside collaborators" enabled on the repo settings.
jobs:
  # The floor check. Runs on a GitHub-hosted image whose Xcode (27.0 /
  # Swift 6.4) is exactly the package's minimum, so a change that only compiles
  # on a newer toolchain fails here. No fork gate: hosted runners are
  # untrusted-code-safe, so this is the CI signal outside contributors get.
  floor-build-and-test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # Pin the floor toolchain by PATH rather than inheriting the image
      # default. The whole point of this job is to compile at the version
      # Package.swift advertises. The xcode-27 image already carries 27.1 and
      # 27.2 betas; if GitHub bumps its default, inheriting it would keep this
      # job green while silently testing a NEWER toolchain than we promise. If this path ever disappears from the
      # image the job fails loudly, which is the intended outcome.
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      # Vision text recognition cannot run in this VM (every RecognizeTextRequest
      # fails with `e5rt_e5_compiler_compile call failed`), so the two suites
      # that need OCR are skipped here and run on the self-hosted build-and-test
      # job instead. See `visionOCRAvailable` in the test targets.
      ZPLKIT_SKIP_VISION_OCR: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Fails if the pin above drifts from the manifest, so the two can never
      # disagree silently. Derived from Package.swift, so bumping the floor
      # there tells you to repoint the pin.
      - name: Verify this runner is the advertised floor
        shell: bash
        run: |
          set -euo pipefail
          want="$(grep -m1 -oE 'swift-tools-version: *[0-9]+\.[0-9]+' Package.swift | grep -oE '[0-9]+\.[0-9]+')"
          got="$(swift --version 2>&1 | grep -oE 'Swift version [0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+')"
          echo "Package.swift floor: $want / runner Swift: $got"
          if [ "$want" != "$got" ]; then
            echo "::error::Floor drift: Package.swift declares swift-tools-version $want but this runner provides Swift $got. Repoint DEVELOPER_DIR at the Xcode shipping Swift $want, or change the pin deliberately."
            exit 1
          fi

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      # Lives on the hosted runner rather than the self-hosted one, so that a
      # fork PR which breaks a documented example actually fails CI. The
      # self-hosted job is fork-gated, so outside contributors never reached
      # this check while it lived there.
      - name: Typecheck examples
        run: |
          set -euo pipefail
          # SwiftPM writes ZPLKit.swiftmodule (a per-arch directory bundle, so
          # test with -e, not -f) directly into the bin path. Swift 6.3 used
          # <bin>/Modules instead; that layout is below the floor now.
          BIN="$(swift build --show-bin-path)"
          MODDIR="$BIN"
          if [ ! -e "$MODDIR/ZPLKit.swiftmodule" ]; then
            echo "::error::Built ZPLKit module not found under $BIN"; exit 1
          fi
          echo "Using module search path: $MODDIR"
          fail=0
          for f in Examples/*.swift; do
            if swiftc -typecheck -I "$MODDIR" -I "$BIN" "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::Example failed to typecheck against the built module"
              fail=1
            fi
          done
          exit $fail

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          swift test 2>&1 | tee "$log"
          # Deliberately no numeric floor: a fixed bound catches a dropped test
          # target only while (total - dropped_target) stays below it, and that
          # value rises as the suite grows. The guard against a dropped target
          # is the per-module coverage gate on the self-hosted build-and-test
          # job, which runs the whole suite (OCR included).
          ./Scripts/check-test-output.sh "$log"

  # Every platform in Package.swift, actually built. Without this the package
  # advertised iOS/tvOS/watchOS while only macOS was ever compiled, and watchOS
  # was in fact broken at 1.0.0 (ZPLKitVerifier imports Vision, which watchOS
  # does not have). Uses xcodebuild rather than `swift build` because that is
  # what Swift Package Index runs, so a green job here means a green build
  # matrix there. No fork gate: hosted runner.
  cross-platform-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        # visionOS is not declared in Package.swift, but Swift Package Index
        # builds it anyway and lists it on the platforms badge.
        platform: [iOS, tvOS, watchOS, visionOS]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      # `ZPLKit-Package` (every target), NOT `ZPLKit`. The per-product `ZPLKit`
      # scheme builds only that one library, so it passed on watchOS even while
      # ZPLKitVerifier was broken there (1.0.0). Swift Package Index builds the whole
      # package, so this job has to as well or it proves nothing.
      - name: Build for ${{ matrix.platform }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme ZPLKit-Package \
            -destination 'generic/platform=${{ matrix.platform }}' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  # `.spi.yml` declares four documentation_targets, but nothing ever built
  # them, so a DocC break would have surfaced only as missing documentation on
  # Swift Package Index, after a release. `xcodebuild docbuild` covers it
  # without taking on the swift-docc-plugin dependency. Hosted runner, no fork
  # gate.
  docs-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      - name: Build documentation
        run: |
          set -euo pipefail
          xcodebuild docbuild \
            -scheme ZPLKit-Package \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/docs" \
            -skipMacroValidation

      # A green docbuild is not sufficient on its own: a target that quietly
      # drops out of the docs build still exits 0. Assert that every target
      # named in .spi.yml produced an archive, so that is loud here rather than
      # a blank page on Swift Package Index.
      - name: Check every .spi.yml documentation target produced an archive
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for target in ZPLKit ZPLKitRenderer ZPLKitPrinter ZPLKitVerifier; do
            if find "$RUNNER_TEMP/docs" -type d -name "$target.doccarchive" | grep -q .; then
              echo "ok: $target.doccarchive"
            else
              echo "::error::docbuild produced no $target.doccarchive, but .spi.yml lists it as a documentation target"
              fail=1
            fi
          done
          exit $fail

  # ZPLKit (ZPL generation) is portable: its only platform dependency is the
  # CoreGraphics-backed Graphic element, already behind `#if canImport`.
  #
  # Package.swift declares only ZPLKit and its tests when the host is not
  # Darwin, so a plain `swift build` / `swift test` works here and actually
  # exercises the core suite. ZPLKitRenderer (CoreGraphics), ZPLKitVerifier
  # (Vision), and ZPLKitPrinter (Network) are Apple-only by design and are not
  # part of the package graph on this runner.
  linux-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: swift:6.4
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      # `-warnings-as-errors` to match the macOS jobs. Without it a Linux-only
      # warning could not fail CI, which is exactly the gap that let the
      # watchOS break ship in 1.0.0 on a platform nothing compiled.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          swift test 2>&1 | tee "$log"
          # Linux keeps a test-count floor rather than a coverage floor: this
          # job builds only ZPLKit, so there is no per-module signal to gate on,
          # and its coverage numbers differ from macOS anyway (the
          # CoreGraphics-gated Graphic element never compiles here). The
          # per-module coverage floors run in the self-hosted build-and-test
          # job, which builds every module. Pinned to the last known total.
          ./Scripts/check-test-output.sh "$log" 184

      # Building the target proves it compiles; this proves a Linux consumer can
      # actually depend on the product and get correct ZPL out. The expected
      # string is byte-identical to what the same program prints on macOS.
      - name: Generate a label from a consumer package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer/Sources/consumer
          cd /tmp/consumer
          # Unquoted heredoc so $GITHUB_WORKSPACE expands to the checkout path.
          cat > Package.swift <<EOF
          // swift-tools-version: 6.4
          import PackageDescription
          let package = Package(
              name: "consumer",
              dependencies: [.package(path: "$GITHUB_WORKSPACE")],
              targets: [.executableTarget(name: "consumer", dependencies: [.product(name: "ZPLKit", package: "zplkit")])]
          )
          EOF
          cat > Sources/consumer/main.swift <<'EOF'
          import ZPLKit

          let label = ZPLLabel(width: 4, height: 2, dpi: .dpi203) {
              Text("HELLO LINUX", at: .inches(0.25, 0.2))
                  .font(.default, height: .inches(0.15))
              Barcode128("ZPLKIT-1234", at: .inches(0.25, 0.6))?
                  .height(.inches(0.5))
                  .showText(true)
              Box(at: .inches(0.1, 0.1), width: .inches(3.8), height: .inches(1.8))
                  .thickness(3)
          }
          print(label.render())
          EOF
          # Keep stderr. Redirecting it to /dev/null here meant a BUILD failure
          # in this step produced no diagnostic at all: `set -e` aborted on the
          # failed assignment before anything was echoed, so the log showed only
          # "exit code 1" with no compiler output to explain it.
          err="$(mktemp)"
          if ! actual="$(swift run 2>"$err")"; then
            echo "::error::The consumer package failed to build or run on Linux"
            echo "--- swift run stderr ---"
            cat "$err"
            exit 1
          fi
          # Warnings are worth seeing even on success.
          if [ -s "$err" ]; then
            echo "--- swift run stderr (non-fatal) ---"
            cat "$err"
          fi
          expected='^XA^PW812^LL406^FO51,41^A0N,30,30^FDHELLO LINUX^FS^FO51,122^BY2^BCN,102,Y,N,N^FDZPLKIT-1234^FS^FO20,20^GB771,365,3,B,0^FS^XZ'
          echo "actual:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Linux output does not match the macOS reference"
            echo "expected: $expected"
            exit 1
          fi

  # WebAssembly. ZPLKit's core is the only portable target and is deliberately
  # free of Foundation, so it cross-compiles to wasm32-unknown-wasip1.
  #
  # This runs on Linux, not macOS, for two reasons that are not worked around:
  #   * Package.swift is evaluated on the HOST. `#if canImport(Darwin)` is true
  #     on macOS, so the package still declares the Apple-only targets and tries
  #     to build them for Wasm. On Linux it correctly reduces to ZPLKit alone.
  #   * The container toolchain matches the Swift SDK. Xcode's Swift is a
  #     different build from the swift.org release that produced the SDK, which
  #     makes module loading fail.
  #
  # The container and the Swift SDK must be the exact same release. Move the
  # image tag, SDK URL, and checksum together.
  wasm-build:
    name: WebAssembly (wasm32-unknown-wasip1)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.4.0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      - name: Install the Swift SDK for WebAssembly
        # Explicit bash: inside a container the default shell is `sh`, which has
        # no `pipefail`, so `set -euo pipefail` aborts the step with exit 2
        # before running anything.
        shell: bash
        run: |
          set -euo pipefail
          swift sdk install \
            "https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz" \
            --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
          swift sdk list

      - name: Build ZPLKit for WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(swift sdk list | grep -E '_wasm$' | head -1)"
          if [ -z "$sdk" ]; then
            echo "::error::No Wasm Swift SDK is installed"; exit 1
          fi
          echo "Using SDK: $sdk"
          swift build --swift-sdk "$sdk" -Xswiftc -warnings-as-errors

      # The core has no Foundation dependency, so a Wasm build that suddenly
      # needs one is a regression. `Double.rounded()` lowering to libm is the
      # specific trap: it links on Darwin implicitly and needs the platform
      # libc import everywhere else (see Sources/ZPLKit/Types/DPI.swift).
      - name: Run the test suite under WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(swift sdk list | grep -E '_wasm$' | head -1)"
          log="$(mktemp)"
          # swift-testing runs under WASI via the WasmKit runtime bundled with
          # the toolchain: measured 184 tests in 31 suites on 6.3.3
          # (2026-09-16), the same count Linux reports (the core target minus
          # the six CoreGraphics-gated Graphic cases, which never compile off
          # Apple platforms).
          #
          # The failure branch below is kept deliberately, but ONLY for the case
          # it was written for: if a future toolchain loses the ability to host
          # tests under WASI, that should degrade to a notice rather than block
          # every PR, because the BUILD is the property this job exists to
          # protect. A FAILING test is a different thing entirely and fails the
          # job -- otherwise the libm-class regression this step exists to catch
          # would sail through as a notice.
          #
          # The discriminator is whether the swift-testing runner produced any
          # output at all. An SDK or link failure never reaches it; a failing
          # test or a runtime trap does. A run that reports zero tests is also a
          # hard failure.
          if swift test --swift-sdk "$sdk" > "$log" 2>&1; then
            echo "Tests ran under WebAssembly:"
            grep -E 'Test run with [0-9]+ test' "$log" || true
            total="$(grep -oE 'Test run with [0-9]+ test' "$log" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}' || true)"
            echo "Total tests run under Wasm: $total"
            if [ "$total" -lt 1 ]; then
              echo "::error::swift test exited 0 under Wasm but ran nothing"; exit 1
            fi
          else
            status=$?
            if grep -qE 'Test run (started|with [0-9]+ test)|Executed [0-9]+ test' "$log"; then
              echo "::error::The test suite ran under WebAssembly and failed (swift test exited $status)"
              echo "--- swift test output ---"
              tail -60 "$log"
              exit 1
            fi
            echo "::notice::Running tests under Wasm is not supported by this toolchain yet; the BUILD above is the gate."
            echo "--- swift test output (informational) ---"
            tail -30 "$log"
          fi

  build-and-test:
    # push/PR only (a manual dispatch runs just the live-printer job), and never
    # for PRs opened from a fork (see the note above).
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macos-27]
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          swift test --enable-code-coverage 2>&1 | tee "$log"
          # No numeric floor, same reasoning as floor-build-and-test.
          ./Scripts/check-test-output.sh "$log"

      # Replaces the old fixed test-count assertion. A count says tests
      # EXECUTED, not that they exercise anything, and a fixed bound stops
      # catching a dropped target once the suite grows past it. See the header
      # comment in Scripts/coverage.sh.
      #
      # Lives here rather than on the hosted floor job because the hosted
      # macOS 27 VM cannot run Vision OCR, so ZPLKitVerifier's coverage there
      # would be artificially low. The cost: fork PRs (which never reach this
      # runner) get no coverage gate, only the hosted build and tests.
      - name: Check per-module coverage floors
        shell: bash
        run: ./Scripts/coverage.sh

  visual-tests:
    # Same fork-gate as build-and-test (see the note above).
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macos-27]
    timeout-minutes: 30
    needs: build-and-test
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build
        run: swift build -c release

      # Fails on render failures or if the reference-image accuracy drops
      # below the threshold. Currently 90.9% across all 125 fixtures; the
      # earlier 92.2% was measured over only 87, twelve of which had
      # wrong-sized references that inflated it.
      - name: Run visual tests with Labelary comparison and scoring
        run: swift run -c release VisualTests --labelary --score --min-score 88

      - name: Get timestamp
        if: always()
        id: timestamp
        run: echo "time=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_OUTPUT

      - name: Upload visual comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-comparison-${{ steps.timestamp.outputs.time }}
          path: |
            Tests/VisualTestHarness/comparison.html
            Tests/VisualTestHarness/output-swift/
            Tests/VisualTestHarness/output-labelary/
            Tests/VisualTestHarness/output-diff/
            Tests/VisualTestHarness/reference/
          retention-days: 7

  # Manual-only: exercises the real networking stack against a physical printer
  # on the runner's LAN. Requires a runner that can reach the printers (the
  # `printers` label) and a printer powered on at `printer_ip`. Never gates PRs.
  live-printer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macos-27, printers]
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      - name: Run live PrinterTests
        env:
          # Manual dispatch input wins; otherwise fall back to the repo variable.
          PRINTER_IP: ${{ github.event.inputs.printer_ip || vars.LIVE_PRINTER_IP }}
        run: |
          if [ -z "$PRINTER_IP" ]; then
            echo "::error::No printer IP. Set the LIVE_PRINTER_IP repository variable or pass one when dispatching."
            exit 1
          fi
          swift run PrinterTests --timeout 15 "$PRINTER_IP"
