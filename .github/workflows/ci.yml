name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Live-printer tests are opt-in: they need a printer powered on and they
  # mutate printer config, so they never gate a normal push/PR.
  workflow_dispatch:
    inputs:
      printer_ip:
        description: "Printer IP for live-hardware PrinterTests"
        required: false
        default: "192.168.7.5"

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The package requires the macOS 27 SDK / Swift 6.4, which GitHub-hosted runner
# images don't carry yet, so all jobs run on the self-hosted mini. Target it by
# capability label (macos-27) rather than a machine name, so other projects can
# share the same runner. DEVELOPER_DIR pins the Xcode 27 beta toolchain without
# sudo (the Command Line Tools toolchain can't run the swift-testing suite).
env:
  DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer

jobs:
  build-and-test:
    runs-on: [self-hosted, macos-27]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Typecheck examples
        run: |
          set -euo pipefail
          MODDIR=$(dirname "$(find .build -path '*/debug/Modules/ZPLKit.swiftmodule' ! -path '*index-build*' | head -1)")
          if [ -z "$MODDIR" ] || [ ! -d "$MODDIR" ]; then
            echo "::error::Could not locate built ZPLKit module directory"; exit 1
          fi
          fail=0
          for f in Examples/*.swift; do
            if swiftc -typecheck -I "$MODDIR" "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::Example failed to typecheck against the built module"
              fail=1
            fi
          done
          exit $fail

      - name: Run unit tests
        run: swift test

  visual-tests:
    runs-on: [self-hosted, macos-27]
    timeout-minutes: 30
    needs: build-and-test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build
        run: swift build -c release

      # Fails on render failures or if the reference-image accuracy drops
      # below the threshold (92.2% at the time the gate was added).
      - name: Run visual tests with Labelary comparison and scoring
        run: swift run -c release VisualTests --labelary --score --min-score 88

      - name: Get timestamp
        if: always()
        id: timestamp
        run: echo "time=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_OUTPUT

      - name: Upload visual comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-comparison-${{ steps.timestamp.outputs.time }}
          path: |
            Tests/VisualTestHarness/comparison.html
            Tests/VisualTestHarness/output-swift/
            Tests/VisualTestHarness/output-labelary/
            Tests/VisualTestHarness/output-diff/
            Tests/VisualTestHarness/reference/
          retention-days: 7

  # Manual-only: exercises the real networking stack against a physical printer
  # on the runner's LAN. Requires a runner that can reach the printers (the
  # `printers` label) and a printer powered on at `printer_ip`. Never gates PRs.
  live-printer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macos-27, printers]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      - name: Run live PrinterTests
        run: swift run PrinterTests --timeout 15 "${{ github.event.inputs.printer_ip }}"
