name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Typecheck examples
        run: |
          set -euo pipefail
          MODDIR=$(dirname "$(find .build -path '*/debug/Modules/ZPLKit.swiftmodule' ! -path '*index-build*' | head -1)")
          if [ -z "$MODDIR" ] || [ ! -d "$MODDIR" ]; then
            echo "::error::Could not locate built ZPLKit module directory"; exit 1
          fi
          fail=0
          for f in Examples/*.swift; do
            if swiftc -typecheck -I "$MODDIR" "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::Example failed to typecheck against the built module"
              fail=1
            fi
          done
          exit $fail

      - name: Run unit tests
        run: swift test

  visual-tests:
    runs-on: macos-26
    timeout-minutes: 30
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Build
        run: swift build -c release

      - name: Run visual tests with Labelary comparison and scoring
        run: swift run -c release VisualTests --labelary --score
        continue-on-error: true

      - name: Get timestamp
        id: timestamp
        run: echo "time=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_OUTPUT

      - name: Upload visual comparison
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison-${{ steps.timestamp.outputs.time }}
          path: |
            Tests/VisualTestHarness/comparison.html
            Tests/VisualTestHarness/output-swift/
            Tests/VisualTestHarness/output-labelary/
            Tests/VisualTestHarness/output-diff/
            Tests/VisualTestHarness/reference/
          retention-days: 7
