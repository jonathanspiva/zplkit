name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Live-printer tests are opt-in: they need a printer powered on and they
  # mutate printer config, so they never gate a normal push/PR.
  workflow_dispatch:
    inputs:
      printer_ip:
        # Leave blank to fall back to the LIVE_PRINTER_IP repository variable
        # (Settings -> Secrets and variables -> Actions -> Variables), so the
        # real lab IP lives in repo settings, not in this committed file.
        description: "Printer IP (blank = use the LIVE_PRINTER_IP repo variable)"
        required: false
        default: ""

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two classes of runner, on purpose:
#
#   * GitHub-hosted `macos-26`: macOS 26 + Xcode 26.6 (Swift 6.3). This is the
#     toolchain that matches the package's advertised floor, so it is what
#     proves the package actually builds for the users we promise support to.
#     Being hosted, it is also safe for fork PRs.
#   * Self-hosted mini (`macos-27`) runs macOS 27 with only the Xcode 27
#     beta, and is the only machine that can reach the lab printers. It covers
#     the visual suite and the live-printer job.
#
# Stable Xcode 26 is NOT an option on the mini: Apple does not support Xcode
# 26.x on macOS 27 (it refuses to launch), so the beta is the only usable
# toolchain there. That is why the floor check lives on the hosted runner
# instead of just repointing DEVELOPER_DIR.
#
# DEVELOPER_DIR is therefore set per-job rather than workflow-wide, because the hosted
# runner has no /Applications/Xcode-beta.app and must use its image default.

# Fork PRs must NOT run on the self-hosted runner: it lives on a private LAN
# (with printer access), so a fork PR running there would execute untrusted code
# on that machine. This condition runs jobs for pushes and same-repo PRs only;
# fork PRs are skipped on the self-hosted jobs. They still get build + full
# test coverage from the hosted `floor-build-and-test` job above, which carries
# no fork gate. As a second layer, keep Actions -> "Require approval for all
# outside collaborators" enabled on the repo settings.
jobs:
  # The floor check. Runs on a GitHub-hosted image whose default Xcode (26.6 /
  # Swift 6.3) is exactly the package's minimum, so a change that only compiles
  # on a newer toolchain fails here. No fork gate: hosted runners are
  # untrusted-code-safe, so this is the CI signal outside contributors get.
  floor-build-and-test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          swift test 2>&1 | tee "$log"
          # A green `swift test` does not prove the suite ran: the Xcode 27 beta
          # silently executed only the first test target and still exited 0
          # (244 of 670 tests). Assert the count so a truncated run is loud.
          total="$(grep -oE 'Test run with [0-9]+ test' "$log" | grep -oE '[0-9]+' | tail -1 || true)"
          if [ -z "$total" ]; then
            echo "::error::Could not determine the test count from 'swift test' output"; exit 1
          fi
          echo "Total tests run: $total"
          if [ "$total" -lt 600 ]; then
            echo "::error::Only $total tests ran; expected the full suite (~670)"; exit 1
          fi

  # Every platform in Package.swift, actually built. Without this the package
  # advertised iOS/tvOS/watchOS while only macOS was ever compiled, and watchOS
  # was in fact broken at 1.0.0 (ZPLKitVerifier imports Vision, which watchOS
  # does not have). Uses xcodebuild rather than `swift build` because that is
  # what Swift Package Index runs, so a green job here means a green build
  # matrix there. No fork gate: hosted runner.
  cross-platform-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      # `ZPLKit-Package` (every target), NOT `ZPLKit`. The per-product `ZPLKit`
      # scheme builds only that one library, so it passes on watchOS even when
      # ZPLKitVerifier is broken there. Swift Package Index builds the whole
      # package, so this job has to as well or it proves nothing.
      - name: Build for ${{ matrix.platform }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme ZPLKit-Package \
            -destination 'generic/platform=${{ matrix.platform }}' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  build-and-test:
    # push/PR only (a manual dispatch runs just the live-printer job), and never
    # for PRs opened from a fork (see the note above).
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macos-27]
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Typecheck examples
        run: |
          set -euo pipefail
          # Products dir holds every built .swiftmodule; layout is stable across
          # toolchains (unlike the old .build/*/debug/Modules glob, which the
          # Swift 6.4 / Xcode 27 SPM layout no longer matches).
          MODDIR="$(swift build --show-bin-path)"
          # ZPLKit.swiftmodule is a directory bundle (per-arch) under the new
          # SPM layout, so test for existence (-e), not a regular file (-f).
          if [ ! -e "$MODDIR/ZPLKit.swiftmodule" ]; then
            echo "::error::Built ZPLKit module not found in $MODDIR"; exit 1
          fi
          fail=0
          for f in Examples/*.swift; do
            if swiftc -typecheck -I "$MODDIR" "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::Example failed to typecheck against the built module"
              fail=1
            fi
          done
          exit $fail

      # Do NOT collapse this back to a bare `swift test`.
      #
      # On the Xcode 27 beta toolchain (verified 2026-08-14 against
      # 27A5218g / Swift 6.4), an unfiltered `swift test` executes only the
      # FIRST test target and still exits 0: it reported "244 tests in 6
      # suites passed" while the package actually has 670 tests in 73 suites.
      # The other three targets (ZPLKitTests, ZPLKitRendererTests,
      # ZPLKitVerifierTests) were silently never run, so a regression in any
      # of them could not fail CI. All 670 pass when each target is invoked
      # explicitly, and the stable Swift 6.3 toolchain runs all 670 from a
      # bare `swift test`. This is a beta SPM bug, not a package problem.
      #
      # Targets are derived from `swift test list` rather than hardcoded, so a
      # newly added test target is picked up automatically. Revisit once the
      # Xcode 27 GA toolchain runs the full suite unfiltered.
      - name: Run unit tests
        # Explicit bash: the word-splitting of `$targets` below is a bash/sh
        # behaviour. zsh does not split unquoted expansions, which silently
        # collapses the loop into a single bogus filter.
        shell: bash
        run: |
          set -euo pipefail
          targets="$(swift test list 2>/dev/null | grep -oE '^[A-Za-z0-9_]+Tests' | sort -u)"
          if [ -z "$targets" ]; then
            echo "::error::Could not enumerate test targets from 'swift test list'"; exit 1
          fi
          echo "Test targets: $(echo "$targets" | tr '\n' ' ')"
          total=0
          for target in $targets; do
            echo "::group::$target"
            log="$(mktemp)"
            # `< /dev/null` so swift test can't swallow the loop's stdin.
            swift test --filter "$target" < /dev/null 2>&1 | tee "$log"
            echo "::endgroup::"
            # A filter that matches nothing prints this and STILL exits 0, so
            # an enumeration bug would otherwise pass CI with zero tests run.
            if grep -q 'No matching test cases were run' "$log"; then
              echo "::error::Filter '$target' matched no tests"; exit 1
            fi
            n="$(grep -oE 'Test run with [0-9]+ test' "$log" | grep -oE '[0-9]+' | tail -1 || true)"
            if [ -z "$n" ]; then
              echo "::error::Could not determine test count for '$target'"; exit 1
            fi
            total=$(( total + n ))
          done
          echo "Total tests run: $total"
          # Backstop against the beta's silent single-target run (244 of 670).
          if [ "$total" -lt 600 ]; then
            echo "::error::Only $total tests ran; expected the full suite (~670)"; exit 1
          fi

  visual-tests:
    # Same fork-gate as build-and-test (see the note above).
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macos-27]
    timeout-minutes: 30
    needs: build-and-test
    env:
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build
        run: swift build -c release

      # Fails on render failures or if the reference-image accuracy drops
      # below the threshold. Currently 90.9% across all 124 fixtures; the
      # earlier 92.2% was measured over only 87, twelve of which had
      # wrong-sized references that inflated it.
      - name: Run visual tests with Labelary comparison and scoring
        run: swift run -c release VisualTests --labelary --score --min-score 88

      - name: Get timestamp
        if: always()
        id: timestamp
        run: echo "time=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_OUTPUT

      - name: Upload visual comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-comparison-${{ steps.timestamp.outputs.time }}
          path: |
            Tests/VisualTestHarness/comparison.html
            Tests/VisualTestHarness/output-swift/
            Tests/VisualTestHarness/output-labelary/
            Tests/VisualTestHarness/output-diff/
            Tests/VisualTestHarness/reference/
          retention-days: 7

  # Manual-only: exercises the real networking stack against a physical printer
  # on the runner's LAN. Requires a runner that can reach the printers (the
  # `printers` label) and a printer powered on at `printer_ip`. Never gates PRs.
  live-printer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macos-27, printers]
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode-beta.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      - name: Run live PrinterTests
        env:
          # Manual dispatch input wins; otherwise fall back to the repo variable.
          PRINTER_IP: ${{ github.event.inputs.printer_ip || vars.LIVE_PRINTER_IP }}
        run: |
          if [ -z "$PRINTER_IP" ]; then
            echo "::error::No printer IP. Set the LIVE_PRINTER_IP repository variable or pass one when dispatching."
            exit 1
          fi
          swift run PrinterTests --timeout 15 "$PRINTER_IP"
