name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run unit tests
        run: swift test

  visual-tests:
    runs-on: macos-26
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Build
        run: swift build -c release

      - name: Run visual tests with Labelary comparison and scoring
        run: swift run -c release VisualTests --labelary --score

      - name: Get timestamp
        id: timestamp
        run: echo "time=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_OUTPUT

      - name: Upload visual comparison
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison-${{ steps.timestamp.outputs.time }}
          path: |
            Tests/VisualTestHarness/comparison.html
            Tests/VisualTestHarness/output-swift/
            Tests/VisualTestHarness/output-labelary/
            Tests/VisualTestHarness/output-diff/
            Tests/VisualTestHarness/reference/
          retention-days: 7
