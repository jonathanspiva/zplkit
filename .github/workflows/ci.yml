name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Live-printer tests are opt-in: they need a printer powered on and they
  # mutate printer config, so they never gate a normal push/PR.
  workflow_dispatch:
    inputs:
      printer_ip:
        # Leave blank to fall back to the LIVE_PRINTER_IP repository variable
        # (Settings -> Secrets and variables -> Actions -> Variables), so the
        # real lab IP lives in repo settings, not in this committed file.
        description: "Printer IP (blank = use the LIVE_PRINTER_IP repo variable)"
        required: false
        default: ""

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two classes of runner, on purpose:
#
#   * GitHub-hosted `macos-26`: macOS 26 + Xcode 26.6 (Swift 6.3). This is the
#     toolchain that matches the package's advertised floor, so it is what
#     proves the package actually builds for the users we promise support to.
#     Being hosted, it is also safe for fork PRs. The floor job pins this
#     toolchain by path and asserts it against Package.swift, rather than
#     inheriting whatever the image default happens to be.
#   * Self-hosted mini (`macos-27`) runs macOS 27 with Xcode 27, and is the
#     only machine that can reach the lab printers. It covers the visual suite
#     and the live-printer job.
#
# Both moved to release toolchains on 2026-09-15: macOS 27 (Golden Gate) and
# Swift 6.4 went GA, so the mini now runs Xcode 27.0 GA (27A266a) instead of
# the beta it was stuck on. Stable Xcode 26 remains impossible there (Apple
# does not support Xcode 26.x on macOS 27), which is still why the floor check
# lives on the hosted runner rather than being a DEVELOPER_DIR repoint.
#
# DEVELOPER_DIR is set per-job rather than workflow-wide because the two runner
# classes need different Xcodes: the floor pin on the hosted image, and
# /Applications/Xcode.app on the mini.
#
# NOTE on test counts: from Swift 6.4, SwiftPM defaults to `--build-system
# swiftbuild`, which prints one "Test run with N tests" summary PER TARGET
# instead of the single merged line the deprecated `native` system printed.
# Any step that counts tests must SUM those lines. See the comment in the
# floor job's "Run unit tests" step.

# Fork PRs must NOT run on the self-hosted runner: it lives on a private LAN
# (with printer access), so a fork PR running there would execute untrusted code
# on that machine. This condition runs jobs for pushes and same-repo PRs only;
# fork PRs are skipped on the self-hosted jobs. They still get build + full
# test coverage from the hosted `floor-build-and-test` job above, which carries
# no fork gate. As a second layer, keep Actions -> "Require approval for all
# outside collaborators" enabled on the repo settings.
jobs:
  # The floor check. Runs on a GitHub-hosted image whose default Xcode (26.6 /
  # Swift 6.3) is exactly the package's minimum, so a change that only compiles
  # on a newer toolchain fails here. No fork gate: hosted runners are
  # untrusted-code-safe, so this is the CI signal outside contributors get.
  floor-build-and-test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Pin the floor toolchain by PATH rather than inheriting the image
      # default. The whole point of this job is to compile at the version
      # Package.swift advertises; if GitHub bumps the macos-26 image default,
      # inheriting it would keep this job green while silently testing a
      # NEWER toolchain than we promise. If this path ever disappears from the
      # image the job fails loudly, which is the intended outcome.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Fails if the pin above drifts from the manifest, so the two can never
      # disagree silently. Derived from Package.swift, so bumping the floor
      # there tells you to repoint the pin.
      - name: Verify this runner is the advertised floor
        shell: bash
        run: |
          set -euo pipefail
          want="$(grep -m1 -oE 'swift-tools-version: *[0-9]+\.[0-9]+' Package.swift | grep -oE '[0-9]+\.[0-9]+')"
          got="$(swift --version 2>&1 | grep -oE 'Swift version [0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+')"
          echo "Package.swift floor: $want / runner Swift: $got"
          if [ "$want" != "$got" ]; then
            echo "::error::Floor drift: Package.swift declares swift-tools-version $want but this runner provides Swift $got. Repoint DEVELOPER_DIR at the Xcode shipping Swift $want, or change the pin deliberately."
            exit 1
          fi

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      # Lives on the hosted runner rather than the self-hosted one, so that a
      # fork PR which breaks a documented example actually fails CI. The
      # self-hosted job is fork-gated, so outside contributors never reached
      # this check while it lived there.
      - name: Typecheck examples
        run: |
          set -euo pipefail
          # Where SwiftPM puts .swiftmodule files depends on the toolchain, so
          # probe rather than assume. Swift 6.3 / Xcode 26 writes them to
          # <bin-path>/Modules; the Swift 6.4 / Xcode 27 layout writes them to
          # <bin-path> itself. This step used to hardcode the latter, which is
          # why it only ever passed on the self-hosted beta runner.
          BIN="$(swift build --show-bin-path)"
          MODDIR=""
          for candidate in "$BIN/Modules" "$BIN"; do
            # ZPLKit.swiftmodule is a directory bundle (per-arch) under the
            # newer layout, so test for existence (-e), not a file (-f).
            if [ -e "$candidate/ZPLKit.swiftmodule" ]; then
              MODDIR="$candidate"; break
            fi
          done
          if [ -z "$MODDIR" ]; then
            found="$(find .build -maxdepth 6 -name 'ZPLKit.swiftmodule' -print -quit 2>/dev/null || true)"
            if [ -n "$found" ]; then MODDIR="$(dirname "$found")"; fi
          fi
          if [ -z "$MODDIR" ]; then
            echo "::error::Built ZPLKit module not found under $BIN or .build"; exit 1
          fi
          echo "Using module search path: $MODDIR"
          fail=0
          for f in Examples/*.swift; do
            if swiftc -typecheck -I "$MODDIR" -I "$BIN" "$f"; then
              echo "ok: $f"
            else
              echo "::error file=$f::Example failed to typecheck against the built module"
              fail=1
            fi
          done
          exit $fail

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          swift test 2>&1 | tee "$log"
          # A green `swift test` does not prove the suite ran. Two distinct
          # failure shapes, both observed on this package:
          #
          #   * It runs an unstable SUBSET of the test targets and still exits
          #     0. On the Xcode 27 beta that was 244 of 683 tests (2026-08-14,
          #     27A5218g) and later 408 of 683 (2026-09-04, 6.4.0.33.1) with a
          #     different pair of targets dropped each time. It is not a stable
          #     "first target only" rule.
          #   * It exits 0 when NO test bundle loads at all. With only the
          #     Command Line Tools selected, every bundle failed to dlopen
          #     Testing.framework, all four targets reported failures, and the
          #     exit code was still 0.
          #
          # So assert on the output rather than the exit code: no target
          # reported failures, and the total is plausible.
          if grep -q 'Some test targets reported failures' "$log"; then
            echo "::error::A test target reported failures ('swift test' still exited 0)"; exit 1
          fi
          # SUM the summary lines, do not take the last one. The two build
          # systems report different SHAPES:
          #   * native (Swift 6.3 / Xcode 26): one merged line, "708 tests in
          #     82 suites".
          #   * swiftbuild (the default from Swift 6.4 / Xcode 27): one line
          #     PER TEST TARGET, e.g. 114 + 186 + 163 + 245 = 708.
          # A `tail -1` reads only the last target under swiftbuild. That is
          # what produced the bogus "244 of 683" and "408 of 683" readings
          # previously recorded as a toolchain bug; nothing was ever skipped.
          total="$(grep -oE 'Test run with [0-9]+ test' "$log" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')"
          if [ -z "$total" ] || [ "$total" = "0" ]; then
            echo "::error::Could not determine the test count from 'swift test' output"; exit 1
          fi
          echo "Total tests run: $total"
          # 600 is chosen to catch a silently DROPPED TARGET, not to track the
          # exact total: the largest remainder after losing any one target is
          # 708 - 114 = 594. Adding tests only widens that margin, so this
          # bound does not need bumping every time the suite grows.
          if [ "$total" -lt 600 ]; then
            echo "::error::Only $total tests ran; expected the full suite (708)"; exit 1
          fi

  # Every platform in Package.swift, actually built. Without this the package
  # advertised iOS/tvOS/watchOS while only macOS was ever compiled, and watchOS
  # was in fact broken at 1.0.0 (ZPLKitVerifier imports Vision, which watchOS
  # does not have). Uses xcodebuild rather than `swift build` because that is
  # what Swift Package Index runs, so a green job here means a green build
  # matrix there. No fork gate: hosted runner.
  cross-platform-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [iOS, tvOS, watchOS]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      # `ZPLKit-Package` (every target), NOT `ZPLKit`. The per-product `ZPLKit`
      # scheme builds only that one library, so it passes on watchOS even when
      # ZPLKitVerifier is broken there. Swift Package Index builds the whole
      # package, so this job has to as well or it proves nothing.
      - name: Build for ${{ matrix.platform }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -scheme ZPLKit-Package \
            -destination 'generic/platform=${{ matrix.platform }}' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  # `.spi.yml` declares four documentation_targets, but nothing ever built
  # them, so a DocC break would have surfaced only as missing documentation on
  # Swift Package Index, after a release. `xcodebuild docbuild` covers it
  # without taking on the swift-docc-plugin dependency. Hosted runner, no fork
  # gate.
  docs-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      - name: Build documentation
        run: |
          set -euo pipefail
          xcodebuild docbuild \
            -scheme ZPLKit-Package \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/docs" \
            -skipMacroValidation

      # A green docbuild is not sufficient on its own: a target that quietly
      # drops out of the docs build still exits 0. Assert that every target
      # named in .spi.yml produced an archive, so that is loud here rather than
      # a blank page on Swift Package Index.
      - name: Check every .spi.yml documentation target produced an archive
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for target in ZPLKit ZPLKitRenderer ZPLKitPrinter ZPLKitVerifier; do
            if find "$RUNNER_TEMP/docs" -type d -name "$target.doccarchive" | grep -q .; then
              echo "ok: $target.doccarchive"
            else
              echo "::error::docbuild produced no $target.doccarchive, but .spi.yml lists it as a documentation target"
              fail=1
            fi
          done
          exit $fail

  # ZPLKit (ZPL generation) is portable: its only platform dependency is the
  # CoreGraphics-backed Graphic element, already behind `#if canImport`.
  #
  # Package.swift declares only ZPLKit and its tests when the host is not
  # Darwin, so a plain `swift build` / `swift test` works here and actually
  # exercises the core suite. ZPLKitRenderer (CoreGraphics), ZPLKitVerifier
  # (Vision), and ZPLKitPrinter (Network) are Apple-only by design and are not
  # part of the package graph on this runner.
  linux-build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: swift:6.3
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      # `-warnings-as-errors` to match the macOS jobs. Without it a Linux-only
      # warning could not fail CI, which is exactly the gap that let the
      # watchOS break ship in 1.0.0 on a platform nothing compiled.
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          swift test 2>&1 | tee "$log"
          # Same reasoning as the macOS jobs: a green `swift test` does not
          # prove the suite ran, and it exits 0 even when a target fails to
          # load. Assert on the output, not the exit code.
          if grep -q 'Some test targets reported failures' "$log"; then
            echo "::error::A test target reported failures ('swift test' still exited 0)"; exit 1
          fi
          # Sum the summary lines, do not take the last. This container is on
          # Swift 6.3, whose native build system prints ONE merged line, so
          # tail -1 happens to work today. It stops working the moment the
          # container is bumped to 6.4, where `swiftbuild` becomes the default
          # and prints one line per test target. See the floor job's comment.
          total="$(grep -oE 'Test run with [0-9]+ test' "$log" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')"
          if [ -z "$total" ] || [ "$total" = "0" ]; then
            echo "::error::Could not determine the test count from 'swift test' output"; exit 1
          fi
          echo "Total tests run: $total"
          if [ "$total" -lt 175 ]; then
            echo "::error::Only $total tests ran; expected the full ZPLKit suite (180)"; exit 1
          fi

      # Building the target proves it compiles; this proves a Linux consumer can
      # actually depend on the product and get correct ZPL out. The expected
      # string is byte-identical to what the same program prints on macOS.
      - name: Generate a label from a consumer package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer/Sources/consumer
          cd /tmp/consumer
          # Unquoted heredoc so $GITHUB_WORKSPACE expands to the checkout path.
          cat > Package.swift <<EOF
          // swift-tools-version: 6.3
          import PackageDescription
          let package = Package(
              name: "consumer",
              dependencies: [.package(path: "$GITHUB_WORKSPACE")],
              targets: [.executableTarget(name: "consumer", dependencies: [.product(name: "ZPLKit", package: "zplkit")])]
          )
          EOF
          cat > Sources/consumer/main.swift <<'EOF'
          import ZPLKit

          let label = ZPLLabel(width: 4, height: 2, dpi: .dpi203) {
              Text("HELLO LINUX", at: .inches(0.25, 0.2))
                  .font(.default, height: .inches(0.15))
              Barcode128("ZPLKIT-1234", at: .inches(0.25, 0.6))?
                  .height(.inches(0.5))
                  .showText(true)
              Box(at: .inches(0.1, 0.1), width: .inches(3.8), height: .inches(1.8))
                  .thickness(3)
          }
          print(label.render())
          EOF
          actual="$(swift run 2>/dev/null)"
          expected='^XA^PW812^LL406^FO51,41^A0N,30,30^FDHELLO LINUX^FS^FO51,122^BY2^BCN,102,Y,N,N^FDZPLKIT-1234^FS^FO20,20^GB771,365,3,B,0^FS^XZ'
          echo "actual:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Linux output does not match the macOS reference"
            echo "expected: $expected"
            exit 1
          fi

  build-and-test:
    # push/PR only (a manual dispatch runs just the live-printer job), and never
    # for PRs opened from a fork (see the note above).
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macos-27]
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      # An unfiltered `swift test` is correct here, but its OUTPUT must be
      # summed, not tail'd. The two build systems report different shapes:
      #
      #   * native (Swift 6.3 / Xcode 26): one merged summary line,
      #     "Test run with 708 tests in 82 suites".
      #   * swiftbuild (the default from Swift 6.4 / Xcode 27): one summary
      #     line PER TEST TARGET: 114 + 186 + 163 + 245 = 708, in
      #     22 + 31 + 23 + 6 = 82 suites. Those per-target figures are
      #     illustrative and move whenever tests are added; only the TOTAL is
      #     asserted below.
      #
      # This job previously ran a per-target filter loop because a `tail -1`
      # over the swiftbuild shape read only the LAST target and looked like a
      # silently truncated run ("244 of 683" on 2026-08-14, "408 of 683" on
      # 2026-09-04). Measured on Xcode 27.0 GA (27A266a / swiftlang-6.4.0.34.1)
      # on 2026-09-15: all four targets run under both build systems and the
      # totals reconcile exactly. No tests were ever being skipped, so the loop
      # is gone.
      #
      # The exit code still proves nothing on its own: a bundle that fails to
      # dlopen Testing.framework reports failures and `swift test` STILL exits
      # 0 (seen with only the Command Line Tools selected). That is a real bug
      # and the grep below is what catches it. Keep it.
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          log="$(mktemp)"
          swift test 2>&1 | tee "$log"
          if grep -q 'Some test targets reported failures' "$log"; then
            echo "::error::A test target reported failures ('swift test' still exited 0)"; exit 1
          fi
          total="$(grep -oE 'Test run with [0-9]+ test' "$log" | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}')"
          if [ -z "$total" ] || [ "$total" = "0" ]; then
            echo "::error::Could not determine the test count from 'swift test' output"; exit 1
          fi
          echo "Total tests run: $total"
          # 600 is chosen to catch a silently DROPPED TARGET, not to track the
          # exact total: the largest remainder after losing any one target is
          # 708 - 114 = 594. Adding tests only widens that margin, so this
          # bound does not need bumping every time the suite grows.
          if [ "$total" -lt 600 ]; then
            echo "::error::Only $total tests ran; expected the full suite (708)"; exit 1
          fi

  visual-tests:
    # Same fork-gate as build-and-test (see the note above).
    if: >-
      github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macos-27]
    timeout-minutes: 30
    needs: build-and-test
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build
        run: swift build -c release

      # Fails on render failures or if the reference-image accuracy drops
      # below the threshold. Currently 90.9% across all 125 fixtures; the
      # earlier 92.2% was measured over only 87, twelve of which had
      # wrong-sized references that inflated it.
      - name: Run visual tests with Labelary comparison and scoring
        run: swift run -c release VisualTests --labelary --score --min-score 88

      - name: Get timestamp
        if: always()
        id: timestamp
        run: echo "time=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_OUTPUT

      - name: Upload visual comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-comparison-${{ steps.timestamp.outputs.time }}
          path: |
            Tests/VisualTestHarness/comparison.html
            Tests/VisualTestHarness/output-swift/
            Tests/VisualTestHarness/output-labelary/
            Tests/VisualTestHarness/output-diff/
            Tests/VisualTestHarness/reference/
          retention-days: 7

  # Manual-only: exercises the real networking stack against a physical printer
  # on the runner's LAN. Requires a runner that can reach the printers (the
  # `printers` label) and a printer powered on at `printer_ip`. Never gates PRs.
  live-printer:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macos-27, printers]
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Show Swift version
        run: swift --version

      - name: Run live PrinterTests
        env:
          # Manual dispatch input wins; otherwise fall back to the repo variable.
          PRINTER_IP: ${{ github.event.inputs.printer_ip || vars.LIVE_PRINTER_IP }}
        run: |
          if [ -z "$PRINTER_IP" ]; then
            echo "::error::No printer IP. Set the LIVE_PRINTER_IP repository variable or pass one when dispatching."
            exit 1
          fi
          swift run PrinterTests --timeout 15 "$PRINTER_IP"
